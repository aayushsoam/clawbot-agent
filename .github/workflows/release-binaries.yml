name: Build and Upload Release Binaries

on:
  release:
    types: [published, created]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to attach binaries to (e.g. v2026.5.15)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-upload:
    name: Build & Upload Desktop App for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            build_cmd: npm run dist:linux
          - os: macos-latest
            build_cmd: npm run dist:mac
          - os: windows-latest
            build_cmd: npm run dist:win
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install root and workspace dependencies
        run: |
          npm ci

      - name: Build Electron Desktop App
        run: |
          cd apps/desktop
          ${{ matrix.build_cmd }}

      - name: Upload Binary to Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ github.event.release.tag_name || github.event.inputs.tag_name }}"
          if [ -z "$TAG_NAME" ]; then
            TAG_NAME="${{ github.ref_name }}"
          fi
          echo "Uploading to release: $TAG_NAME"
          
          # Find and upload generated installers
          for ext in dmg zip exe msi AppImage deb rpm; do
            for file in apps/desktop/release/*.$ext; do
              if [ -f "$file" ]; then
                echo "Uploading $file..."
                gh release upload "$TAG_NAME" "$file" --repo "${{ github.repository }}" --clobber
              fi
            done
          done

  generate-release-notes:
    name: Generate & Update Release Notes
    needs: build-and-upload
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update release description with auto-generated notes
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ github.event.release.tag_name || github.event.inputs.tag_name }}"
          if [ -z "$TAG_NAME" ]; then
            TAG_NAME="${{ github.ref_name }}"
          fi
          echo "Generating and updating release notes for tag: $TAG_NAME"
          gh release edit "$TAG_NAME" --generate-notes --repo "${{ github.repository }}"
